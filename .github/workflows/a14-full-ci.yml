name: A14 Full CI

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a14-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: CI portability
        run: python tools/check_ci_portability.py

      - name: Python tool tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Static governance checks
        run: |
          python tools/check-invariants.py
          python tools/check_automation_state.py
          python tools/check_document_contracts.py
          python tools/check_goal_constitution.py
          python tools/progress_snapshot.py --check

      - name: Full machine verifier
        run: python tools/verify.py full

      - name: Safe debug and develop builds
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          ./gradlew --no-daemon :app:assembleDevelop

      - name: R8 lint on develop
        run: ./gradlew --no-daemon :app:lintVitalDevelop

      - name: Upload develop artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: develop-apk-and-mapping
          path: |
            app/build/outputs/apk/develop/*.apk
            app/build/outputs/mapping/develop/mapping.txt
            app/build/outputs/mapping/develop/usage.txt
            app/build/outputs/mapping/develop/configuration.txt
          if-no-files-found: ignore
