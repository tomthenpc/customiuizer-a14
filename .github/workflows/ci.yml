name: CI

on:
  push:
    branches: [main, hardening/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Static Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run static invariant gate
        run: python tools/check-invariants.py
      - name: Validate ADB regression smoke plan
        run: python tools/adb-regression.py validate-plan --plan adb-regression/a14-smoke.json
      - name: Validate ADB regression evidence schema
        run: python -c "import json, pathlib; json.loads(pathlib.Path('adb-regression/evidence-schema.json').read_text(encoding='utf-8'))"
      - name: Run ROM scanner fixture tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"
      - name: Audit feature semantics
        run: python tools/audit-feature-semantics.py --validate

  test-lint-build:
    name: Test, Lint and Build
    runs-on: ubuntu-latest
    needs: invariants
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Gradle wrapper jar checksum
        shell: bash
        run: sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          gradle-home-cache-cleanup: true
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test --no-daemon
      - name: Lint
        run: ./gradlew lintDebug lintRelease lintVitalRelease --no-daemon
      - name: Build debug, unsigned release and probe
        run: ./gradlew assembleDebug assembleRelease :broadcast-probe:assembleDebug --no-daemon
      - name: Verify APK signatures and file names
        shell: bash
        run: |
          python tools/verify-apk-signatures.py \
            --debug-apk app/build/outputs/apk/debug/CustoMIUIzer-A14-r14.13.8-debug.apk \
            --release-apk app/build/outputs/apk/release/CustoMIUIzer-A14-r14.13.8-unsigned-ci.apk \
            --release-kind ci
      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/CustoMIUIzer-A14-r14.13.8-debug.apk
          retention-days: 7
      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/release/CustoMIUIzer-A14-r14.13.8-unsigned-ci.apk
          retention-days: 7
      - name: Upload Broadcast Probe Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broadcast-probe-debug-apk
          path: tools/broadcast-probe/build/outputs/apk/debug/broadcast-probe-debug.apk
          retention-days: 7
      - name: Upload Lint reports on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: lint-reports
          path: app/build/reports/lint-*.html
          retention-days: 7
