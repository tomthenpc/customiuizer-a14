name: CI

on:
  push:
    branches: [main, hardening/*]
  pull_request:
    branches: [main]

jobs:
  invariants:
    name: Static Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static invariant gate
        run: python tools/check-invariants.py

  test-lint-build:
    name: Test, Lint and Build
    runs-on: ubuntu-latest
    needs: invariants
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test --no-daemon
      - name: Lint
        run: ./gradlew lintDebug lintRelease lintVitalRelease --no-daemon
      - name: Build debug and unsigned release
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Verify APK outputs exist
        shell: bash
        run: |
          ls -l app/build/outputs/apk/debug/
          ls -l app/build/outputs/apk/release/
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
